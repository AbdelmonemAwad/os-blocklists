#
# The page's questions. errors:no on each: every script here prints a JSON answer and exits 0, and
# this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/blocklists/status.py
parameters:
errors:no
type:script_output
message:reading the block lists

# The aliases made to say what the settings say. The page's Apply then reloads the filter, which
# registers the rules (plugins.inc.d/blocklists.inc), and the aliases, which fetches the lists.
[apply]
command:/usr/local/opnsense/scripts/blocklists/apply.php
parameters:
errors:no
type:script_output
message:writing the block lists' aliases

# ThreatFox's command-and-control list (threatfox.py), run by the page's Apply, detached: fetched where
# abuse.ch's pace allows, an export whose last try failed tried again now (a refused Auth-Key too: it
# may have just been replaced), and put into pf's table. The cron entry runs it without --apply. The
# Auth-Key is never a parameter: the script reads it from config.xml.
[threatfox]
command:/usr/local/opnsense/scripts/blocklists/threatfox.py
parameters:--apply
errors:no
type:script_output
message:fetching ThreatFox's command-and-control addresses

# UT1's web categories (categories.py, 2026-11-19), run by the page's Apply, detached: a category just
# chosen, or one whose last fetch failed, fetched now; one no longer chosen taken out; and Unbound's
# blocklist rebuilt (configctl unbound dnsbl) once, where something its handler reads changed. The cron
# entry runs it without --apply.
[categories]
command:/usr/local/opnsense/scripts/blocklists/categories.py
parameters:--apply
errors:no
type:script_output
message:fetching and applying the web categories

# Where a name or an address is held (lookup.py, 2026-11-19), for the page's Lookup tab: read only. The
# one parameter is checked by the page's controller and again by the script, and configd quotes it.
[lookup]
command:/usr/local/opnsense/scripts/blocklists/lookup.py
parameters:%s
errors:no
type:script_output
message:looking up a name or an address in the block lists

# What the IPS drops (ids_list.py, ff-10, 2026-11-19): one reading, run by the page's Apply, detached;
# the cron entry runs it through the minute. ids_entries lists what is held, for the page's grid;
# ids_remove takes one address out - its one parameter checked by the page's controller and again by
# the script, and quoted by configd.
[ids]
command:/usr/local/opnsense/scripts/blocklists/ids_list.py
parameters:
errors:no
type:script_output
message:reading what the IPS drops

[ids_entries]
command:/usr/local/opnsense/scripts/blocklists/ids_list.py --list
parameters:
errors:no
type:script_output
message:listing what the IPS dropped

[ids_remove]
command:/usr/local/opnsense/scripts/blocklists/ids_list.py --remove
parameters:%s
errors:no
type:script_output
message:taking an address out of what the IPS dropped

[cut]
command:/usr/local/opnsense/scripts/blocklists/cut.py
parameters:
errors:no
type:script_output
message:cutting connections to newly listed addresses

[ja4]
command:/usr/local/opnsense/scripts/blocklists/ja4_cut.py
parameters:
errors:no
type:script_output
message:cutting connections by TLS fingerprint

# The fingerprints in the IDS's TLS log now, the most frequent first - to find the one to list.
[seen]
command:/usr/local/opnsense/scripts/blocklists/ja4_cut.py --seen
parameters:
errors:no
type:script_output
message:reading the TLS fingerprints seen
