#
# The page's questions. errors:no on each: every script here prints a JSON answer and exits 0, and
# this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/blocklists/status.py
parameters:
errors:no
type:script_output
message:reading the block lists

# The aliases made to say what the settings say. The page's Apply then reloads the filter, which
# registers the rules (plugins.inc.d/blocklists.inc), and the aliases, which fetches the lists.
[apply]
command:/usr/local/opnsense/scripts/blocklists/apply.php
parameters:
errors:no
type:script_output
message:writing the block lists' aliases

[cut]
command:/usr/local/opnsense/scripts/blocklists/cut.py
parameters:
errors:no
type:script_output
message:cutting connections to newly listed addresses

[ja4]
command:/usr/local/opnsense/scripts/blocklists/ja4_cut.py
parameters:
errors:no
type:script_output
message:cutting connections by TLS fingerprint

# The fingerprints in the IDS's TLS log now, the most frequent first - to find the one to list.
[seen]
command:/usr/local/opnsense/scripts/blocklists/ja4_cut.py --seen
parameters:
errors:no
type:script_output
message:reading the TLS fingerprints seen
